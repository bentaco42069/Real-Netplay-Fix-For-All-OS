<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0f1115" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Claude Remote" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="style.css" />
  <title>Claude Phone Remote</title>
</head>
<body>
  <header id="bar">
    <div id="dot" class="dot"></div>
    <div id="status">starting…</div>
    <div class="spacer"></div>
    <button id="liveBtn" class="chip" title="Live screen view">Live: off</button>
    <button id="shotBtn" class="chip" title="Grab one frame">Shot</button>
  </header>

  <!-- PIN gate (shown until connected) -->
  <section id="gate" class="gate">
    <h1>Claude Phone Remote</h1>
    <p class="muted">Enter the 4-digit PIN shown in the host window on your PC.</p>
    <input id="pinInput" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="PIN" />
    <button id="connectBtn" class="primary">Connect</button>
    <p id="gateMsg" class="muted small"></p>
  </section>

  <!-- Live screen -->
  <main id="screenWrap" class="screen-wrap hidden">
    <img id="screen" alt="PC screen" draggable="false" />
    <div id="tapHint" class="tap-hint">tap the screen to click there</div>
  </main>

  <!-- Prompt-to-Claude box -->
  <section id="promptBox" class="prompt-box hidden">
    <textarea id="promptText" rows="2" placeholder="Type a prompt for Claude…"></textarea>
    <div class="row">
      <label class="check"><input type="checkbox" id="autoSend" checked /> press Enter</label>
      <button id="sendClaude" class="primary">Send to Claude</button>
    </div>
    <p id="promptNote" class="muted small"></p>
  </section>

  <!-- Keyboard / control strip -->
  <nav id="keys" class="keys hidden">
    <button data-key="enter">⏎ Enter</button>
    <button data-key="esc">Esc</button>
    <button data-key="tab">Tab</button>
    <button data-key="backspace">⌫</button>
    <button data-key="up">▲</button>
    <button data-key="down">▼</button>
    <button data-key="left">◀</button>
    <button data-key="right">▶</button>
    <button data-hotkey="ctrl,c">Copy</button>
    <button data-hotkey="ctrl,v">Paste</button>
    <button data-hotkey="ctrl,z">Undo</button>
    <button id="typeBtn">⌨︎ Type text</button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
